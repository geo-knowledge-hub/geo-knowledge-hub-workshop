[project]
name = "lem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dtaidistance>=2.4.0",
    "matplotlib>=3.10.8",
    "minisom>=2.3.6",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "pydash>=8.0.6",
