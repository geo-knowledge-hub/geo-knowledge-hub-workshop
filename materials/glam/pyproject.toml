    "scipy>=1.17.1",
    "statsmodels>=0.14.6"
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "ruff>=0.15.11",
    "ruff>=0.15.11",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
